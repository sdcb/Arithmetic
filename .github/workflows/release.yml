name: Release

# Push a tag like v0.1.0-preview.1 to test, pack and publish Sdcb.Arithmetic to nuget.org.
# Publishing uses NuGet Trusted Publishing (OIDC); the nuget.org policy is bound to
# sdcb/Arithmetic + release.yml, so the publish job only runs in that repository.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  pack:
    name: test + pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Resolve version
        id: ver
        run: |
          $ref = '${{ github.ref_name }}'
          if ('${{ github.ref_type }}' -eq 'tag') {
            if ($ref -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') { throw "Tag '$ref' is not v<semver>" }
            $v = $Matches[1]
          } else {
            $v = (Select-Xml -Path src/Sdcb.Arithmetic/Sdcb.Arithmetic.csproj -XPath '//Version').Node.InnerText
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"
      - name: Test
        run: dotnet test tests/Sdcb.Arithmetic.Tests -c Release
      - name: Pack
        run: dotnet pack src/Sdcb.Arithmetic -c Release -o artifacts/nupkg -p:Version=${{ steps.ver.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/nupkg/*

  publish:
    name: publish to nuget.org
    needs: pack
    if: github.repository == 'sdcb/Arithmetic' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub release
      id-token: write # OIDC token for NuGet Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: nupkg
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: sdflysha
      - name: Push
        run: dotnet nuget push "nupkg/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ needs.pack.outputs.version }}'
          $extra = @(); if ($v -like '*-*') { $extra += '--prerelease' }
          gh release create '${{ github.ref_name }}' (Get-ChildItem nupkg/*).FullName --repo '${{ github.repository }}' --title "v$v" --generate-notes @extra
